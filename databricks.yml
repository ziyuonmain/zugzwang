# Declarative Automation Bundle definition for Zugzwang.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: zugzwang

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog name for Zugzwang data assets
    default: zugzwang_dev

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-d8edd36b-109e.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: zugzwang_dev

  prod:
    workspace:
      host: https://dbc-d8edd36b-109e.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: zugzwang_prod
