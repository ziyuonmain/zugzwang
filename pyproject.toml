[project]
name = "zugzwang"
version = "0.1.0"
description = "Open-source railway data platform built on Databricks"
readme = "README.md"
authors = [
    { name = "Ziyu Wang", email = "47520232+ziyuonmain@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyspark>=3.5.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "Q",
    "D",
]
ignore = [
    "E501",  # Line length handled by ruff format
    "D104",  # Missing docstring in public package (__init__.py)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
