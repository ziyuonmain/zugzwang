[project]
name = "zugzwang"
version = "0.1.0"
description = "Open-source railway data platform built on Databricks"
readme = "README.md"
authors = [
    { name = "Ziyu Wang", email = "47520232+ziyuonmain@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyspark>=3.5.0",
    "pyarrow>=14.0.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",  # Line length handled by ruff format
]
