resources:
  pipelines:
    zugzwang_june2026:
      name: "[${bundle.target}] Zugzwang June 2026 Pipeline"
      tags:
        project: zugzwang
        environment: ${bundle.target}
        component: transformation
      schema: ${resources.schemas.silver.name}
      catalog: ${var.catalog}
      continuous: false
      serverless: true
      channel: preview
      environment:
        dependencies:
          - pyyaml==6.0.3
      libraries:
        - file:
            path: ../src/pipeline.py
      configuration:
        zugzwang.environment: ${bundle.target}
        zugzwang.volume_base_path: "/Volumes/${var.catalog}/${resources.schemas.raw.name}/${resources.volumes.landing.name}"
