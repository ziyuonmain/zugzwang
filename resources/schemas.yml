resources:
  schemas:
    raw:
      name: raw
      catalog_name: ${var.catalog}
      comment: "Bronze-equivalent landing boundary containing immutable upstream railway, station-reference, and weather source artifacts"

    silver:
      name: silver
      catalog_name: ${var.catalog}
      comment: "Normalized reusable railway, DB InfraGO station, DWD weather, and nearest-sensor mapping datasets"

    gold:
      name: gold
      catalog_name: ${var.catalog}
      comment: "Consumer-facing analytical datasets combining operational railway events with station and environmental context"

  volumes:
    landing:
      name: landing
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.raw.name}
      volume_type: MANAGED
      comment: "Manifest-validated immutable source snapshot containing railway Parquet, StaDa JSON, and extracted DWD observation files"
